[build-system]
requires = ["setuptools>=77"]  # PEP 639: license as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "wlr-share-picker"
dynamic = ["version"]  # wlr_share_picker.__version__; the PKGBUILD repeats it and tests/test_release.py checks both
description = "Thumbnail picker for screen sharing with xdg-desktop-portal-wlr"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Erik Manchego" }]
keywords = ["wayland", "xdg-desktop-portal", "screenshare", "wlroots", "gtk4"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
# Sin dependencias de PyPI a propósito: PyGObject, GTK 4, gtk4-layer-shell y grim son paquetes del sistema.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis"]

[project.scripts]
wlr-share-picker = "wlr_share_picker.cli:main"

[project.urls]
Repository = "https://github.com/fire-fox/wlr-share-picker"

[tool.setuptools]
packages = ["wlr_share_picker"]
dynamic = { version = { attr = "wlr_share_picker.__version__" } }
# The locale/ tree is data listed below, not subpackages (without this setuptools warns on every build).
include-package-data = false

[tool.setuptools.package-data]
wlr_share_picker = ["locale/*/LC_MESSAGES/*.mo", "locale/*.pot", "locale/*/LC_MESSAGES/*.po"]

[tool.ruff]
line-length = 130
extend-exclude = ["legacy"]
target-version = "py311"

[tool.ruff.lint]
# S = the bandit security rules; every exception in the package is justified inline where it happens.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S108"]  # asserts, running the launcher, fakes and desktop tools by name, tmp paths
"scripts/*" = ["S311"]  # seeded random for the drawings of the demo screenshot, not for secrets

[tool.mutmut]  # scripts/mutation.sh, weekly in CI
paths_to_mutate = ["wlr_share_picker/"]
tests_dir = ["tests/"]
also_copy = ["README.md", "CHANGELOG.md", "config.example.toml", "packaging/", "scripts/", "wlr-share-picker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
