name: release
# Pushing a tag vX.Y.Z (scripts/release.sh prepares it) builds, checks, signs and publishes the release through the
# reusable build workflow; nothing is published until the owner approves it in the `release` environment.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/build.yml  # zizmor: ignore[self-repository] `$/` is not in GitHub's workflow syntax docs yet
    permissions:
      contents: write
      id-token: write
      attestations: write
