name: ci
# Every check runs in scripts/ci.sh, inside a fresh Arch (scripts/ci-container.sh), the same as on your machine.
# The job itself runs on the VM so that Harden-Runner can watch its network and files; the container gets no token.
on:
  push:
    branches: ["**"]  # tags go through the release workflow, which runs the same checks before building
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Watch the runner's network and files (Harden-Runner)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # Only these endpoints and GitHub's own: what Harden-Runner recorded in audit mode, plus geo.mirror.pkgbuild.com,
          # the fallback mirror in the Arch image's mirrorlist.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            fastly.mirror.pkgbuild.com:443
            geo.mirror.pkgbuild.com:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the whole history, for gitleaks and trufflehog
          persist-credentials: false
      - name: Every check, inside a fresh Arch (scripts/ci.sh)
        env:
          GH_TOKEN: ${{ github.token }}  # read-only; only zizmor's own container receives it
        run: scripts/ci-container.sh checks
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            fastly.mirror.pkgbuild.com:443
            geo.mirror.pkgbuild.com:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The picker on a headless desktop, through the real portal (tests/desktop)
        run: scripts/ci-container.sh desktop "$RUNNER_TEMP/desktop"
      - name: Logs and a screenshot of the test desktop (only test windows on it)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test
          path: ${{ runner.temp }}/desktop
          retention-days: 7
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: No vulnerable or unexpected dependency comes in with the pull request
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
