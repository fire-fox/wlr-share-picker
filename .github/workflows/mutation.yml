name: mutation
# Weekly mutation testing (scripts/mutation.sh): how many small bugs the tests would catch, per module, in the run's
# summary. Informational: it does not fail on a low score.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mutation testing inside a fresh Arch
        run: scripts/ci-container.sh mutation "$RUNNER_TEMP/mutation"
      - name: Report in the run summary
        run: cat "$RUNNER_TEMP/mutation/mutation.md" >> "$GITHUB_STEP_SUMMARY"
