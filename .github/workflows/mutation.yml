name: mutation
# Weekly mutation testing (scripts/mutation.sh): how many small bugs the tests would catch, per module, in the run's
# summary. Informational: it does not fail on a low score.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            fastly.mirror.pkgbuild.com:443
            files.pythonhosted.org:443
            geo.mirror.pkgbuild.com:443
            github.com:443
            production.cloudfront.docker.com:443
            pypi.org:443
            registry-1.docker.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mutation testing inside a fresh Arch
        run: scripts/ci-container.sh mutation "$RUNNER_TEMP/mutation"
      - name: Report in the run summary
        run: cat "$RUNNER_TEMP/mutation/mutation.md" >> "$GITHUB_STEP_SUMMARY"
