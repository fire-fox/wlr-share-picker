# wlr-share-picker — ~/.config/wlr-share-picker/config.toml (every key is optional)

# frontend = "auto"        # auto: GTK and, if it cannot start, dmenu · gtk · dmenu
# fallback = true          # allow falling back to a dmenu when GTK fails
# dmenu = []               # custom dmenu command, e.g. ["fuzzel", "--dmenu"]; empty = fuzzel/wofi/bemenu/rofi, first installed
# title = ""               # empty = "What do you want to share?" in your language
# thumbnail_width = 320    # px; height is 5/8 of the width
# columns = 0              # 0 = derived from the monitor width
# max_columns = 6
# capture_timeout = 2.5    # seconds per thumbnail (a window already being shared hangs grim)
# capture_threads = 4      # captures running at once
# refresh_seconds = 2.0    # live thumbnails: re-capture every N seconds while open; 0 = capture once
# monitor_scale = 0.2
# window_scale = 0.35
# jpeg_quality = 70
# reuse_choice_seconds = 90  # the same app asking again within this window gets the same answer (Chromium asks twice); 0 = off
# remember_choice = true   # preselect what you shared last time (by window id, else by app)
# hide_app_ids = []        # never list windows of these app ids, e.g. ["herdr", "org.kde.dolphin"]
# hide_titles = []         # nor windows whose title contains one of these, e.g. ["Picture-in-Picture"]
# show_requester = true   # title says which app is asking ("Chromium wants to share your screen")
# theme = "auto"           # auto: your ~/.config/gtk-4.0/gtk.css palette (DankMaterialShell, matugen…), else dark/light by colour scheme
# debug = false            # or WLR_SHARE_PICKER_DEBUG=1

# Tables go last: in TOML every key after a [table] header belongs to that table.
# [auto]                   # apps answered without a dialog: requesting app (desktop id, its last segment or process name) → monitor or window app id
# rustdesk = "DP-1"        # e.g. RustDesk connecting while you are away (Sunshine and wayvnc capture directly, no portal)
# [colors]                 # per-key overrides on top of the theme
# accent = "#ffb866"
# background = "rgba(19,19,19,0.95)"
# card = "#1f1f1f"
# card_border = "#2c2c2c"
# text = "#e2e2e2"
# muted = "#9a9a9a"
# accent_text = "#482900"
# empty = "#0c0c0c"
